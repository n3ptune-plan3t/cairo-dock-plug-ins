[package]
name = "niri-ipc-client"
version = "1.0.0"
edition = "2024"

[dependencies]
tokio = { version = "1.42", features = ["rt-multi-thread", "io-util", "net", "sync"] }
niri-ipc = "=25.11.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"

[lib]
crate-type = ["cdylib", "rlib"]
